# Decoy database credentials. All values are fake.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
# Opaque: a generic key/value Secret.
type: Opaque
# stringData: plain-text values; Kubernetes base64-encodes them into `data` on save.
# (base64 is encoding, not encryption: anyone who can read the Secret can decode it.)
stringData:
  username: app
  password: FAKE-DB-PASSWORD
  host: postgres.ai-lab-decoy.svc
