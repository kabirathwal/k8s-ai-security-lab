# Makes the decoy look like Postgres: postgres.ai-lab-decoy.svc:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      # Clients connect to the usual Postgres port...
      port: 5432
      # ...and are forwarded to nginx's port 80 in the pod.
      targetPort: http
