# The API key, held in a Secret instead of a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: chat-api-secret
type: Opaque
# CONTROL: credential lives in a Secret (#12), and since ENABLE_DEBUG stays false it isn't exposed
# via /debug/env (#4). Value is fake, per repo rules.
stringData:
  API_KEY: FAKE-API-KEY
